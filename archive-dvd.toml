# video-steward manifest for the Aaahh!!! Real Monsters DVD archive.
#
# Episode numbers in [disc.*] are load-bearing: 0 means "unmapped TODO" and
# blocks conversion. Files you do not want archived go under [ignore.*].

[show]
tmdb_id = 2429
name = "Aaahh Real Monsters"
season = 1

[paths]
source_root = "C:/Users/rd/Videos"
local_output = "C:/Users/rd/Videos/_converted"
destination_root = "Z:/video/shows"

# How finished files are written to the destination:
#   auto    = native filesystem when reachable (mounted share / Windows),
#             otherwise PowerShell under WSL (uses Windows' saved share creds)
#   native  = always Node fs (requires the share mounted at the path above)
#   windows = always PowerShell (WSL interop; Z: drive as mapped in Windows)
[share]
backend = "auto"

# Episode order follows the DVD PGC/menu order (t-number in filename).
# All 24 files are complete episodes; 11 lack the ~47s opening theme
# (disc-authoring choice, verified via chapter structure) and are archived as-is.
[disc.ARM_S1_D1]
  "D2_t00.mkv" = 1   # 00:23:35; 1.1 GB
  "D3_t01.mkv" = 2   # 00:23:50; 1.1 GB
  "D7_t02.mkv" = 3   # 00:11:51; 510 MB; no opening theme
